[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline"
version = "0.1.0"
description = "Check that a project's documentation still describes the project: every command, path, target and variable a README claims, verified against the repository."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Mohsen Shehata" }]
keywords = [
  "documentation", "readme", "runbook", "ci", "linter",
  "developer-experience", "static-analysis", "llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

# Nothing at runtime. tomllib is standard library from 3.11, which is why that
# is the floor, and the model is reached over plain HTTP rather than a client.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
plumbline = "plumbline.cli:main"

[project.urls]
Homepage = "https://github.com/RootX22/plumbline"
Issues = "https://github.com/RootX22/plumbline/issues"

[tool.setuptools.packages.find]
include = ["plumbline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET"]
ignore = ["SIM108"]
